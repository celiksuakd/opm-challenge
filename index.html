<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CP2 CHALLENGE — Plants & Operations</title>
<style>
  :root {
    --bg: #07090f;
    --bg2: #0e1320;
    --card: #131a2c;
    --card2: #1a2340;
    --text: #e6f1ff;
    --muted: #6b7a99;
    --accent: #00ff9f;
    --accent2: #00d9ff;
    --danger: #ff3860;
    --warn: #ffb800;
    --locked: #2a3147;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,255,159,0.02) 0px,
      rgba(0,255,159,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 9999;
  }
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
    z-index: 9998;
  }
  #app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
    min-height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* HUD */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    background: var(--card);
    border: 1px solid var(--accent);
    box-shadow: 0 0 20px rgba(0,255,159,0.15);
    margin-bottom: 20px;
    border-radius: 6px;
  }
  .hud-item { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .hud-label { color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-size: 11px; }
  .hud-value { color: var(--accent); font-weight: bold; font-size: 18px; }
  .lives { display: flex; gap: 4px; }
  .life { width: 18px; height: 18px; color: var(--danger); font-size: 18px; line-height: 1; }
  .life.lost { color: var(--locked); }
  .streak.hot .hud-value { color: var(--warn); text-shadow: 0 0 10px var(--warn); }
  .streak.fire .hud-value { color: var(--danger); text-shadow: 0 0 14px var(--danger); animation: pulse 0.6s infinite; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  @keyframes glitch {
    0% { transform: translate(0); }
    20% { transform: translate(-3px, 2px); }
    40% { transform: translate(3px, -2px); }
    60% { transform: translate(-2px, -2px); }
    80% { transform: translate(2px, 2px); }
    100% { transform: translate(0); }
  }

  /* TITLE SCREEN */
  .title-screen { text-align: center; padding-top: 80px; }
  .title {
    font-size: 64px;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 24px var(--accent), 0 0 60px rgba(0,255,159,0.3);
    margin-bottom: 12px;
  }
  .subtitle {
    color: var(--accent2);
    letter-spacing: 6px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .tagline {
    color: var(--muted);
    margin-bottom: 60px;
    font-size: 15px;
  }
  .boot-log {
    text-align: left;
    max-width: 500px;
    margin: 30px auto;
    background: var(--bg2);
    border: 1px solid var(--locked);
    padding: 16px;
    font-size: 12px;
    color: var(--muted);
    min-height: 140px;
  }
  .boot-log .line { margin: 2px 0; }
  .boot-log .ok { color: var(--accent); }
  .boot-log .warn { color: var(--warn); }

  .btn {
    background: transparent;
    border: 2px solid var(--accent);
    color: var(--accent);
    padding: 14px 32px;
    font-family: inherit;
    font-size: 16px;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    margin: 6px;
  }
  .btn:hover {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 24px var(--accent);
  }
  .btn.secondary { border-color: var(--muted); color: var(--muted); }
  .btn.secondary:hover { background: var(--muted); color: var(--bg); box-shadow: none; }
  .btn.danger { border-color: var(--danger); color: var(--danger); }
  .btn.danger:hover { background: var(--danger); color: var(--bg); box-shadow: 0 0 24px var(--danger); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* MAP */
  .map-header { text-align: center; margin-bottom: 24px; }
  .map-title { font-size: 28px; color: var(--accent); letter-spacing: 3px; }
  .map-sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .room-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }
  .room-card {
    background: var(--card);
    border: 1px solid var(--locked);
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .room-card.unlocked {
    border-color: var(--accent2);
    box-shadow: 0 0 12px rgba(0,217,255,0.2);
  }
  .room-card.unlocked:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 0 24px rgba(0,255,159,0.4);
  }
  .room-card.completed {
    border-color: var(--accent);
    background: linear-gradient(135deg, var(--card) 0%, rgba(0,255,159,0.06) 100%);
  }
  .room-card.locked { opacity: 0.4; cursor: not-allowed; }
  .room-card.boss {
    grid-column: span 2;
    background: linear-gradient(135deg, var(--card2) 0%, rgba(255,56,96,0.08) 100%);
    border-color: var(--danger);
  }
  .room-card.boss.locked { border-color: var(--locked); }
  .room-id {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .room-name { font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--text); }
  .room-date { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .room-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .stars { color: var(--warn); letter-spacing: 2px; font-size: 14px; }
  .mastery { font-size: 11px; color: var(--accent); }
  .lock-icon { color: var(--muted); }

  /* ROOM (in-game) */
  .question-screen { padding: 0; }
  .question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--locked);
  }
  .breadcrumb { color: var(--muted); font-size: 12px; letter-spacing: 2px; }
  .breadcrumb .accent { color: var(--accent); }
  .q-progress { color: var(--accent2); font-size: 13px; }

  .question-card {
    background: var(--card);
    border: 1px solid var(--accent2);
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 0 30px rgba(0,217,255,0.1);
  }
  .q-type-badge {
    display: inline-block;
    background: var(--bg2);
    color: var(--accent2);
    padding: 4px 10px;
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 16px;
    border: 1px solid var(--accent2);
  }
  .q-prompt {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 24px;
    color: var(--text);
  }
  .q-prompt code, .q-prompt .eq {
    font-family: ui-monospace, monospace;
    background: var(--bg2);
    padding: 1px 6px;
    color: var(--accent);
    border-radius: 3px;
  }

  /* MCQ options */
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: var(--bg2);
    border: 1px solid var(--locked);
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.15s;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 15px;
    color: var(--text);
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .option:hover { border-color: var(--accent2); background: var(--card2); }
  .option.selected { border-color: var(--accent); background: rgba(0,255,159,0.08); }
  .option.correct { border-color: var(--accent); background: rgba(0,255,159,0.18); box-shadow: 0 0 16px rgba(0,255,159,0.3); }
  .option.wrong { border-color: var(--danger); background: rgba(255,56,96,0.15); animation: glitch 0.3s; }
  .option-letter {
    display: inline-block;
    width: 28px; height: 28px;
    border: 1px solid var(--muted);
    text-align: center;
    line-height: 26px;
    font-weight: bold;
    color: var(--muted);
    flex-shrink: 0;
  }
  .option.selected .option-letter, .option.correct .option-letter { border-color: var(--accent); color: var(--accent); }
  .option.wrong .option-letter { border-color: var(--danger); color: var(--danger); }

  /* Numeric input */
  .numeric-wrap { display: flex; gap: 12px; align-items: center; }
  .numeric-input {
    background: var(--bg2);
    border: 1px solid var(--accent2);
    color: var(--accent);
    padding: 14px 18px;
    font-family: inherit;
    font-size: 24px;
    width: 200px;
    text-align: center;
    letter-spacing: 1px;
  }
  .numeric-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .numeric-units { color: var(--muted); font-size: 14px; }

  /* Match */
  .match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .match-col-label {
    color: var(--accent2);
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .match-item {
    background: var(--bg2);
    border: 1px solid var(--locked);
    padding: 12px;
    cursor: pointer;
    margin-bottom: 8px;
    transition: all 0.15s;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
  }
  .match-item:hover { border-color: var(--accent2); }
  .match-item.selected { border-color: var(--accent); background: rgba(0,255,159,0.1); }
  .match-item.paired { opacity: 0.5; cursor: default; border-color: var(--accent); background: rgba(0,255,159,0.05); }
  .match-pair-tag { display: inline-block; color: var(--accent); margin-right: 6px; font-weight: bold; }

  /* Feedback */
  .feedback {
    margin-top: 20px;
    padding: 16px;
    border-left: 3px solid;
    background: var(--bg2);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
  }
  .feedback.correct { border-color: var(--accent); }
  .feedback.wrong { border-color: var(--danger); }
  .feedback-title { font-weight: bold; margin-bottom: 6px; font-family: inherit; letter-spacing: 2px; }
  .feedback.correct .feedback-title { color: var(--accent); }
  .feedback.wrong .feedback-title { color: var(--danger); }
  .feedback-explain { color: var(--muted); }

  .q-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }

  /* Results */
  .result-screen { text-align: center; padding: 40px 0; }
  .result-headline { font-size: 32px; color: var(--accent); letter-spacing: 4px; margin-bottom: 12px; }
  .result-headline.fail { color: var(--danger); }
  .result-room { color: var(--muted); margin-bottom: 32px; }
  .result-stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-bottom: 40px;
  }
  .result-stat { }
  .result-stat-value { font-size: 36px; color: var(--accent); font-weight: bold; }
  .result-stat-label { font-size: 11px; color: var(--muted); letter-spacing: 2px; margin-top: 4px; }
  .result-stars { font-size: 48px; color: var(--warn); letter-spacing: 8px; margin: 20px 0; }

  /* Boss screen accent */
  .boss-mode .question-card { border-color: var(--danger); box-shadow: 0 0 24px rgba(255,56,96,0.2); }
  .boss-mode .q-type-badge { border-color: var(--danger); color: var(--danger); }
  .boss-timer { color: var(--danger); font-size: 24px; font-weight: bold; letter-spacing: 2px; }
  .boss-timer.critical { animation: flicker 0.4s infinite; }

  /* Misc */
  .center { text-align: center; }
  .mt-lg { margin-top: 32px; }
  .ascii { font-family: monospace; white-space: pre; line-height: 1.1; color: var(--accent); opacity: 0.5; font-size: 11px; }
  /* ===== PIKACHU HINT HELPER ===== */
  .pika-helper{position:fixed;right:20px;bottom:20px;z-index:9999;display:none;flex-direction:column;align-items:flex-end;gap:10px;}
  .pika-bubble{position:relative;max-width:262px;background:rgba(6,20,16,0.97);border:1px solid var(--accent);border-radius:12px;padding:11px 14px;color:#d8ffe9;font-size:13px;line-height:1.5;box-shadow:0 0 18px rgba(0,255,159,0.32);opacity:0;transform:translateY(10px) scale(0.96);pointer-events:none;transition:opacity .18s ease,transform .18s ease;}
  .pika-bubble.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .pika-bubble b{color:var(--accent);}
  .pika-bubble::after{content:'';position:absolute;right:30px;bottom:-8px;width:14px;height:14px;background:rgba(6,20,16,0.97);border-right:1px solid var(--accent);border-bottom:1px solid var(--accent);transform:rotate(45deg);}
  .pika-btn{position:relative;width:90px;height:90px;border:none;background:none;padding:0;cursor:pointer;filter:drop-shadow(0 0 10px rgba(255,222,46,0.55));animation:pikaBob 2.4s ease-in-out infinite;transition:transform .15s ease;}
  .pika-btn:hover{transform:scale(1.08) rotate(-3deg);}
  .pika-btn:active{transform:scale(0.93);}
  .pika-btn::before{content:'';position:absolute;inset:10px 8px 8px 8px;border-radius:50%;background:radial-gradient(circle,rgba(255,222,46,0.35),transparent 70%);animation:pikaPulse 2s ease-in-out infinite;z-index:-1;}
  .pika-svg{width:100%;height:100%;display:block;}
  .pika-tag{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);background:var(--accent);color:#04120c;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 9px;border-radius:8px;box-shadow:0 0 8px rgba(0,255,159,0.7);pointer-events:none;white-space:nowrap;}
  @keyframes pikaBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
  @keyframes pikaPulse{0%,100%{transform:scale(0.9);opacity:0.5;}50%{transform:scale(1.25);opacity:0.9;}}
  /* ===== ADMIN ACCESS ===== */
  .admin-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-4px 0 14px;flex-wrap:wrap;}
  .admin-link{background:transparent;border:1px solid var(--locked);color:var(--muted);font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:5px 11px;border-radius:7px;cursor:pointer;transition:all .15s ease;}
  .admin-link:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 10px rgba(0,255,159,0.25);}
  .admin-on{color:var(--accent);font-size:11px;letter-spacing:1px;text-shadow:0 0 8px rgba(0,255,159,0.5);}
</style>
</head>
<body>
<div id="app"></div>
<div class="pika-helper" id="pikaHelper">
  <div class="pika-bubble" id="pikaBubble"></div>
  <button class="pika-btn" id="pikaBtn" onclick="toggleHint()" aria-label="Pikachu hint helper" title="Pika! Need a hint?">
    <svg class="pika-svg" viewBox="0 0 120 132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M34 48 L13 8 Q11 3 17 5 L45 31 Z" fill="#ffde2e" stroke="#2b2410" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M86 48 L107 8 Q109 3 103 5 L75 31 Z" fill="#ffde2e" stroke="#2b2410" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M13 8 Q11 3 17 5 L31 18 L21 25 Z" fill="#2b2410"/>
      <path d="M107 8 Q109 3 103 5 L89 18 L99 25 Z" fill="#2b2410"/>
      <ellipse cx="60" cy="84" rx="47" ry="42" fill="#ffde2e" stroke="#2b2410" stroke-width="2.6"/>
      <circle cx="33" cy="94" r="10.5" fill="#ff5b4a"/>
      <circle cx="87" cy="94" r="10.5" fill="#ff5b4a"/>
      <ellipse cx="44" cy="76" rx="7.6" ry="9.6" fill="#21201c"/>
      <ellipse cx="76" cy="76" rx="7.6" ry="9.6" fill="#21201c"/>
      <circle cx="46.6" cy="72.4" r="2.7" fill="#fff"/>
      <circle cx="78.6" cy="72.4" r="2.7" fill="#fff"/>
      <path d="M56.5 86 h7 l-3.5 3.6 z" fill="#21201c"/>
      <path d="M51 94 Q60 102 69 94" fill="none" stroke="#21201c" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span class="pika-tag">HINT</span>
  </button>
</div>


<script>
// ============================================================
// QUESTION BANK — DCoCP (Dynamics and Control of Chemical Processes)
// Course: Prof. Matteo Pelucchi, Politecnico di Milano, AY 2025/26
// Based on Stephanopoulos "Chemical Process Control" + course calendar
// ============================================================

const ROOMS = [
  {
    id: 'L4', date: 'WK1', name: 'Heat Exchangers — Design & Standards', questions: [
      { type: 'mcq', prompt: 'Manenti distinguishes the RATING problem from the DESIGN problem (slide L4 p.5):',
        options: ['They are the same', 'RATING = calculate required heat-transfer RATE from mass/energy balances; DESIGN = calculate required AREA from U and ΔT_lm', 'Both compute pressure drop', 'Rating is mechanical only'],
        correct: 1, explain: 'Slide L4 p.5 (Manenti). Rating first (what duty?), then design (how big?). For cyclic equipment you also calculate the cycling time. Common student trap: jumping to area sizing without first nailing the duty.' },
      { type: 'mcq', prompt: 'According to Manenti, the dominant design STANDARDS for shell-and-tube HEs are:',
        options: ['ISO 9001 only', 'TEMA (Tubular Exchanger Manufacturers Association) + ASME-API Unfired Pressure Vessel Code', 'EN 1092', 'No standards'],
        correct: 1, explain: 'Slide L4 p.6. TEMA classifies HEs by front/shell/rear-head type (E.G. AES, BEM, etc.). ASME governs pressure-vessel construction. Compliance is non-negotiable in most jurisdictions.' },
      { type: 'mcq', prompt: 'Manenti\'s "compromise" example: HIGH fluid velocity inside small tubes:',
        options: ['Has no downside', 'Improves heat-transfer coefficient (smaller area needed) BUT increases friction loss (pumping cost) — must optimize the trade', 'Always preferred', 'Reduces fouling only'],
        correct: 1, explain: 'Slide L4 p.7. The eternal HE trade-off. Designers use ΔP allowance from the project basis to set a maximum velocity, then trade area against pumping power for minimum NPV.' },
      { type: 'mcq', prompt: 'Manenti distinguishes LOCAL vs GLOBAL optimum in HE design. The global (plant) optimum considers:',
        options: ['Just the unit price', 'The Heat Exchanger Network (HEN), plant-level OPEX/CAPEX, and heat integration — not just the single unit', 'Only ASME code', 'Only TEMA standards'],
        correct: 1, explain: 'Slide L4 p.8. A locally-cheap HE may force expensive utility consumption at the plant level. Pinch analysis (later lecture) is the framework for global optimization.' },
      { type: 'numeric', prompt: 'Heat exchanger: U = 400 W/m²·K, A = 25 m², LMTD = 40 K (pure counter-current, F=1). Heat duty Q? (kW)',
        answer: 400, tolerance: 5, units: 'kW',
        explain: 'Q = U·A·LMTD = 400·25·40 = 400 kW. The fundamental design equation — memorize it. Real designs add a correction factor F (< 1) for multi-pass / partial counter-current configurations.' }
    ]
  },
  {
    id: 'L5', date: 'WK2', name: 'Solar Thermal & CSP', questions: [
      { type: 'mcq', prompt: 'Concentrating Solar Power (CSP) is fundamentally different from photovoltaic because:',
        options: ['It is more expensive', 'CSP collects solar HEAT for a thermal cycle (typically Rankine); PV converts photons directly to electricity', 'CSP uses semiconductors', 'They are the same'],
        correct: 1, explain: 'CSP → thermal storage → dispatchable electricity. PV → direct electricity → needs batteries for storage. CSP\'s thermal-storage advantage is its main competitive edge over PV+battery.' },
      { type: 'mcq', prompt: 'The CONCENTRATION RATIO of a CSP collector is:',
        options: ['Receiver area / aperture area', 'C = APERTURE area / RECEIVER area (a higher C lets you reach a higher temperature)', 'Same as efficiency', 'Mirror reflectivity'],
        correct: 1, explain: 'Larger C → smaller receiver, hotter T, higher Carnot efficiency, but harder optics. Parabolic trough: ~30-80. Tower / dish: 500-3000+.' },
      { type: 'mcq', prompt: 'For HIGH-TEMPERATURE central-tower CSP, the heat transfer / storage fluid is typically:',
        options: ['Liquid water', 'Molten salt (e.g., Solar Salt: 60% NaNO3 + 40% KNO3) — stable to ~565°C, enables 6-15 h thermal storage', 'Liquid sodium', 'Mineral oil'],
        correct: 1, explain: 'Two-tank molten-salt storage decouples solar input from electricity output → CSP becomes dispatchable, competing with gas peakers for evening loads.' },
      { type: 'mcq', prompt: 'A parabolic-trough CSP plant with synthetic thermal oil HTF typically operates up to:',
        options: ['~100°C', '~400°C (oil thermal-stability limit)', '~800°C', '~1500°C'],
        correct: 1, explain: 'Therminol/Dowtherm tops out around 400°C. Hence the industry shift to molten-salt direct steam generation (500-565°C) for better Rankine efficiency.' },
      { type: 'mcq', prompt: 'Thermal energy STORAGE is the key competitive advantage of CSP because:',
        options: ['It is cheaper than batteries', 'It makes CSP DISPATCHABLE — solar input is decoupled from electricity output, allowing evening/night production', 'Both', 'Neither'],
        correct: 2, explain: 'Both, actually. Two-tank molten-salt storage is currently cheaper per kWh than lithium batteries for multi-hour-duration storage. CSP+storage competes with gas peakers, not just baseload solar.' }
    ]
  },
  {

const SAVE_KEY = 'opm_challenge_v1';
let state = loadState();

function defaultState() {
  return {
    screen: 'title',
    lives: 5,
    admin: false,
    score: 0,
    streak: 0,
    bestStreak: 0,
    totalXp: 0,
    currentRoomId: null,
    currentQIdx: 0,
    currentAnswer: null,
    answered: false,
    lastCorrect: null,
    roomResults: [],  // per-question correct/wrong for current room
    progress: {},     // { L1: { stars: 3, mastery: 100, completed: true }, ... }
    bossUnlocked: false,
    bossDone: false,
    bossTimer: null,
    bossStartTime: null,
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    const saved = JSON.parse(raw);
    return { ...defaultState(), ...saved, screen: 'title' };  // always return to title on reload
  } catch (e) {
    return defaultState();
  }
}

function save() {
  try {
    const persist = {
      lives: state.lives, score: state.score, bestStreak: state.bestStreak,
      totalXp: state.totalXp, progress: state.progress,
      bossUnlocked: state.bossUnlocked, bossDone: state.bossDone,
      admin: state.admin,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(persist));
  } catch (e) {}
}

function resetAll() {
  if (!confirm('Wipe all progress and start over? This cannot be undone.')) return;
  localStorage.removeItem(SAVE_KEY);
  state = defaultState();
  render();
}

let audioCtx = null;
function beep(freq, dur, type = 'square', vol = 0.04) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  click: () => beep(800, 0.05),
  correct: () => { beep(660, 0.1); setTimeout(() => beep(990, 0.15), 80); },
  wrong: () => { beep(180, 0.2, 'sawtooth', 0.06); },
  unlock: () => { beep(440, 0.08); setTimeout(() => beep(660, 0.08), 70); setTimeout(() => beep(880, 0.15), 140); },
  boss: () => { beep(110, 0.4, 'sawtooth', 0.08); }
};

function renderQuestionBody(q) {
  const locked = state.answered ? 'style="pointer-events: none;"' : '';
  if (q.type === 'mcq' || q.type === 'error') {
    const options = q.type === 'mcq' ? q.options : q.statements;
    return `<div class="options" ${locked}>` + options.map((opt, i) => {
      let cls = '';
      if (state.currentAnswer === i) cls = 'selected';
      if (state.answered) {
        const correctIdx = q.type === 'mcq' ? q.correct : q.wrongIndex;
        if (i === correctIdx) cls = 'correct';
        else if (i === state.currentAnswer) cls = 'wrong';
      }
      const letter = String.fromCharCode(65 + i);
      return `<div class="option ${cls}" onclick="pickOption(${i})"><span class="option-letter">${letter}</span><span>${opt}</span></div>`;
    }).join('') + '</div>';
  }
  if (q.type === 'numeric') {
    return `
      <div class="numeric-wrap">
        <input type="number" class="numeric-input" id="numInput" step="any"
               value="${state.currentAnswer ?? ''}"
               oninput="state.currentAnswer = this.value === '' ? null : parseFloat(this.value); document.getElementById('submitBtn').disabled = state.currentAnswer === null;"
               onkeydown="if(event.key==='Enter' && !state.answered && state.currentAnswer !== null) submitAnswer();"
               ${state.answered ? 'disabled' : 'autofocus'}>
        <span class="numeric-units">${q.units || ''}</span>
      </div>
    `;
  }
  if (q.type === 'match') {
    // currentAnswer holds: { pairs: { leftIdx: rightIdx }, picking: leftIdx | null }
    if (!state.currentAnswer || typeof state.currentAnswer !== 'object') {
      state.currentAnswer = { pairs: {}, picking: null };
    }
    const ans = state.currentAnswer;
    const rightShuffled = q._shuffledRight || (q._shuffledRight = shuffle(q.pairs.map((p, i) => ({ text: p.right, originalIdx: i }))));
    let html = '<div class="match-grid">';
    // Left column
    html += '<div><div class="match-col-label">TERMS</div>';
    q.pairs.forEach((p, i) => {
      const paired = ans.pairs[i] !== undefined;
      const selected = ans.picking === i;
      const pairTag = paired ? `<span class="match-pair-tag">[${getPairLetter(ans.pairs[i], rightShuffled)}]</span>` : '';
      let revealCls = '';
      if (state.answered) {
        revealCls = ans.pairs[i] === i ? 'correct' : 'wrong';
        revealCls = revealCls === 'correct' ? 'paired' : 'wrong';
      }
      html += `<div class="match-item ${paired ? 'paired' : ''} ${selected ? 'selected' : ''} ${state.answered ? revealCls : ''}"
                onclick="pickMatchLeft(${i})">${pairTag}${p.left}</div>`;
    });
    html += '</div>';
    // Right column (shuffled)
    html += '<div><div class="match-col-label">DEFINITIONS</div>';
    rightShuffled.forEach((r, displayIdx) => {
      const usedBy = Object.entries(ans.pairs).find(([l, rOrig]) => rOrig === r.originalIdx);
      const paired = !!usedBy;
      const letter = String.fromCharCode(65 + displayIdx);
      html += `<div class="match-item ${paired ? 'paired' : ''}" onclick="pickMatchRight(${r.originalIdx})">
                 <span class="match-pair-tag">[${letter}]</span>${r.text}
               </div>`;
    });
    html += '</div></div>';
    return html;
  }
  return '<div>Unsupported question type.</div>';
}

function getPairLetter(originalRightIdx, shuffledRight) {
  const idx = shuffledRight.findIndex(r => r.originalIdx === originalRightIdx);
  return String.fromCharCode(65 + idx);
}

function renderFeedback(q) {

// ============================================================
// EVENT HANDLERS
// ============================================================
function goMap() {
  sfx.click();
  state.screen = 'map';
  state.currentRoomId = null;
  state.currentQIdx = 0;
  state.currentAnswer = null;
  state.answered = false;
  state.roomResults = [];
  state.lives = 5;  // refill lives between rooms
  render();
}

function startRoom(id) {
  sfx.click();
  state.screen = 'room';
  state.currentRoomId = id;
  state.currentQIdx = 0;
  state.currentAnswer = null;
  state.answered = false;
  state.roomResults = [];
  state.lives = 5;
  state.streak = 0;
  // shuffle each room's MCQ option order? No — keep stable for muscle memory.
  // Reset any shuffled match arrays so they re-shuffle on retry:
  ROOMS.find(r => r.id === id).questions.forEach(q => { if (q.type === 'match') delete q._shuffledRight; });
  render();
}

function pickOption(i) {
  if (state.answered) return;
  sfx.click();
  state.currentAnswer = i;
  render();
}

function pickMatchLeft(leftIdx) {
  if (state.answered) return;
  const ans = state.currentAnswer;
  if (ans.pairs[leftIdx] !== undefined) {
    // already paired — unpair
    delete ans.pairs[leftIdx];
    ans.picking = null;
  } else {
    ans.picking = leftIdx;
  }
  sfx.click();
  render();
  maybeFinalizeMatch();
}

function pickMatchRight(rightIdx) {
  if (state.answered) return;
  const ans = state.currentAnswer;
  // if this right is already paired, do nothing
  if (Object.values(ans.pairs).includes(rightIdx)) return;
  if (ans.picking === null) return;
  ans.pairs[ans.picking] = rightIdx;
  ans.picking = null;
  sfx.click();
  render();
  maybeFinalizeMatch();
}

function maybeFinalizeMatch() {
  const q = ROOMS.find(r => r.id === state.currentRoomId)?.questions[state.currentQIdx]
            || BOSS_POOL?.[state.currentQIdx];
  if (!q || q.type !== 'match') return;
  const ans = state.currentAnswer;
  const pairCount = Object.keys(ans.pairs).length;
  document.getElementById('submitBtn').disabled = pairCount !== q.pairs.length;
}

function submitAnswer() {
  const room = state.bossActive
    ? { questions: BOSS_POOL, id: 'BOSS' }
    : ROOMS.find(r => r.id === state.currentRoomId);
  const q = room.questions[state.currentQIdx];
  let correct = false;
  if (q.type === 'mcq') correct = state.currentAnswer === q.correct;
  else if (q.type === 'error') correct = state.currentAnswer === q.wrongIndex;
  else if (q.type === 'numeric') {
    const ans = parseFloat(state.currentAnswer);
    correct = !isNaN(ans) && Math.abs(ans - q.answer) <= (q.tolerance ?? 0.01);
  } else if (q.type === 'match') {
    correct = q.pairs.every((_, i) => state.currentAnswer.pairs[i] === i);
  }

  state.answered = true;
  state.lastCorrect = correct;
  state.roomResults.push(correct);

  if (correct) {
    state.streak++;
    if (state.streak > state.bestStreak) state.bestStreak = state.streak;
    const mult = Math.min(5, 1 + Math.floor(state.streak / 3));
    const gain = (state.bossActive ? 100 : 50) * mult;
    state.totalXp += gain;
    sfx.correct();
  } else {
    state.streak = 0;
    state.lives--;
    sfx.wrong();
  }
  save();
  render();

  // If out of lives mid-room, end the room
  if (state.lives <= 0 && !state.bossActive) {
    setTimeout(() => endRoom(), 1400);
  } else if (state.lives <= 0 && state.bossActive) {
    setTimeout(() => endBoss(), 1400);
  }
}

function nextQuestion() {
  const room = state.bossActive ? { questions: BOSS_POOL } : ROOMS.find(r => r.id === state.currentRoomId);
  state.currentQIdx++;
  state.currentAnswer = null;
  state.answered = false;
  if (state.currentQIdx >= room.questions.length) {
    if (state.bossActive) endBoss();
    else endRoom();
    return;
  }
  // Reset match answer if next is match
  const nextQ = room.questions[state.currentQIdx];
  if (nextQ.type === 'match') state.currentAnswer = { pairs: {}, picking: null };
  render();
}

function endRoom() {
  state.screen = 'result';
  render();
}

function abandonRoom() {
  if (!confirm('Leave this room? Progress within the room is lost.')) return;
  goMap();
}

// ============================================================
// BOSS
// ============================================================
let BOSS_POOL = [];
function startBoss() {
  sfx.click();
  state.screen = 'boss-intro';
  render();
}

function actuallyStartBoss() {
  sfx.boss();
  // Build pool: 10 random from rooms + 5 exclusive
  const allRoomQs = ROOMS.flatMap(r => r.questions);
  BOSS_POOL = [...shuffle(allRoomQs).slice(0, 10), ...BOSS_EXCLUSIVE].sort(() => Math.random() - 0.5);
  // Clear any prior match shuffles
  BOSS_POOL.forEach(q => { if (q.type === 'match') delete q._shuffledRight; });
  state.bossActive = true;
  state.screen = 'room';
  state.currentRoomId = '★ BOSS ROUND ★';
  state.currentQIdx = 0;
  state.currentAnswer = BOSS_POOL[0].type === 'match' ? { pairs: {}, picking: null } : null;
  state.answered = false;
  state.roomResults = [];
  state.lives = 5;
  state.streak = 0;
  // Patch the room lookup: render uses currentRoomId, so we wrap
  render();
}

function endBoss() {
  state.bossActive = false;
  state.screen = 'boss-result';
  render();
}

// Patch render() for boss: when bossActive, treat currentRoom as BOSS_POOL
const originalRenderRoom = renderRoom;
renderRoom = function() {
  if (!state.bossActive) return originalRenderRoom();
  const q = BOSS_POOL[state.currentQIdx];
  if (!q) { state.screen = 'boss-result'; render(); return; }
  let html = renderHUD();
  html += `
    <div class="question-header">
      <div class="breadcrumb">// <span class="accent" style="color: var(--danger);">★ BOSS ROUND</span> · EXAM SIMULATION</div>
      <div class="q-progress">Q ${state.currentQIdx + 1} / ${BOSS_POOL.length}</div>
    </div>
    <div class="question-card boss-mode">
      <div class="q-type-badge" style="border-color: var(--danger); color: var(--danger);">${q.type.toUpperCase()}</div>
      <div class="q-prompt">${q.prompt}</div>
      ${renderQuestionBody(q)}
      ${state.answered ? renderFeedback(q) : ''}
      <div class="q-actions">
        ${state.answered
          ? `<button class="btn danger" onclick="nextQuestion()">${state.currentQIdx + 1 >= BOSS_POOL.length ? 'FINALIZE' : 'NEXT →'}</button>`
          : `<button class="btn danger" id="submitBtn" onclick="submitAnswer()" ${state.currentAnswer === null || (typeof state.currentAnswer === 'object' && Object.keys(state.currentAnswer.pairs || {}).length !== (q.pairs?.length || 0)) ? 'disabled' : ''}>SUBMIT</button>`}
        <button class="btn secondary" onclick="abandonBoss()">ABANDON</button>
      </div>
    </div>
  `;
  app.innerHTML = html;
};

function abandonBoss() {
  if (!confirm('Abandon the boss round? You will need to clear all rooms again to retry.')) return;
  state.bossActive = false;
  goMap();
}

// ============================================================
// UTIL
// ============================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// BOOT
// ============================================================
// ============================================================
// PIKACHU HINT HELPER
// ============================================================
function _pikaCurrentQ() {
  if (state.bossActive) return (typeof BOSS_POOL !== 'undefined') ? BOSS_POOL[state.currentQIdx] : null;
  if (state.screen === 'room') {
    const room = ROOMS.find(r => r.id === state.currentRoomId);
    if (room) return room.questions[state.currentQIdx];
  }
  return null;
}
function _pikaDeriveHint(q) {
  if (q && q.hint) return q.hint;
  let ex = (q && q.explain) ? String(q.explain) : '';
  ex = ex.replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
  if (!ex) return 'Think about the key concept from this lecture — you know this!';
  const m = ex.match(/^.*?[.!?](?=\s|$)/);
  let s = m ? m[0].trim() : ex;
  if (s.length > 180) s = s.slice(0, 177).trim() + '…';
  return s;
}
let _pikaKey = null;
function toggleHint() {
  const bubble = document.getElementById('pikaBubble');
  if (!bubble) return;
  if (bubble.classList.contains('show')) { bubble.classList.remove('show'); return; }
  try { sfx.click(); } catch (e) {}
  let msg;
  const q = _pikaCurrentQ();
  if (state.bossActive) {
    msg = "<b>Pika-pi!</b> No hints in the BOSS ROUND — trust your training, you've got this! ⚡";
  } else if (!q) {
    msg = "<b>Pika!</b> Pick a room and I'll zap you a hint! ⚡";
  } else if (state.answered) {
    msg = "<b>Pika pika!</b> You already answered — read my notes in the feedback below!";
  } else {
    msg = "<b>Pika!</b> " + _pikaDeriveHint(q);
  }
  bubble.innerHTML = msg;
  bubble.classList.add('show');
}
function _pikaUpdate() {
  const helper = document.getElementById('pikaHelper');
  if (!helper) return;
  helper.style.display = (state.screen === 'room') ? 'flex' : 'none';
  const key = state.bossActive
    ? ('boss:' + state.currentQIdx + ':' + (state.answered ? 'a' : 'q'))
    : (String(state.currentRoomId) + ':' + state.currentQIdx + ':' + (state.answered ? 'a' : 'q'));
  if (key !== _pikaKey) {
    _pikaKey = key;
    const bubble = document.getElementById('pikaBubble');
    if (bubble) bubble.classList.remove('show');
  }
}
const _pikaOrigRender = render;
render = function() { _pikaOrigRender(); _pikaUpdate(); };

// ============================================================
// ADMIN ACCESS PASSWORD
// ============================================================
const ADMIN_PASSWORD = 'pikachu';   // <-- change this to set a new master password
function promptAdmin() {
  if (state.admin) {
    if (confirm('Admin mode is ON — every room is unlocked. Turn it OFF?')) {
      state.admin = false; save(); render();
    }
    return;
  }
  const entry = prompt('Enter admin password to unlock every room:');
  if (entry === null) return;
  if (entry === ADMIN_PASSWORD) {
    state.admin = true; save();
    try { sfx.unlock(); } catch (e) {}
    render();
  } else {
    try { sfx.wrong(); } catch (e) {}
    alert('Access denied — wrong password.');
  }
}

render();
</script>
